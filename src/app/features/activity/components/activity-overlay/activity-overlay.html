@if (isOpen()) {
  <!-- Backdrop: click to close overlay -->
  <div
    class="fixed inset-0 z-[1100] bg-black/40 cursor-pointer"
    role="button"
    tabindex="0"
    aria-label="Close activity panel"
    (click)="close()"
    (keydown.enter)="close()"
    (keydown.space)="close()"
  ></div>

  <!-- Overlay panel: slides in from right -->
  <aside
    class="activity-overlay-panel rounded-l-xl fixed top-0 right-0 w-80 max-w-full h-full z-[1101] overflow-y-auto p-4 border-l border-black/[0.08] bg-[var(--mat-sys-surface)] shadow-[-4px_0_12px_rgba(0,0,0,0.15)]"
    role="complementary"
    aria-label="Recent Activity"
  >
    <app-recent-activity></app-recent-activity>
  </aside>
}
