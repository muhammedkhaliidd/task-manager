<section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
  @if (statistics().length > 0) {
    @for (statistic of statistics(); track statistic.id) {
      <app-dashboard-state [statistic]="statistic"></app-dashboard-state>
    }
  } @else if (statisticsLoading()) {
    @for (i of [1, 2, 3, 4]; track i) {
      <div class="shadow-md rounded-lg p-4 bg-white">
        <app-skeleton [lines]="2" [lineHeight]="12"></app-skeleton>
      </div>
    }
  }
</section>
